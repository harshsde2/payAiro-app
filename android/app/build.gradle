apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

/**
 * React Native Config - Environment Configuration
 * Maps build variants to environment files (.env.staging, .env.production)
 * Must be defined BEFORE the apply from dotenv.gradle line
 */
project.ext.envConfigFiles = [
    stagingdebug: ".env.staging",
    stagingrelease: ".env.staging",
    productiondebug: ".env.production",
    productionrelease: ".env.production",
]

// Apply react-native-config plugin
apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["stagingDebug", "productionDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Google Maps SDK (Android) — prefer GOOGLE_MAPS_API_KEY_ANDROID, else legacy GOOGLE_MAPS_API_KEY
def googleMapsApiKey = ""
if (project.hasProperty("env")) {
    def androidKey = (project.env["GOOGLE_MAPS_API_KEY_ANDROID"] ?: "").toString().trim()
    def legacyKey = (project.env["GOOGLE_MAPS_API_KEY"] ?: "").toString().trim()
    googleMapsApiKey = androidKey ? androidKey : legacyKey
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.payairo"
    defaultConfig {
        applicationId "com.payairo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 44
        versionName "3.1.2"
        missingDimensionStrategy 'react-native-camera', 'general'
        
        // Exclude 32-bit ABIs to reduce 16KB compliance issues and AAB size
        // Most modern devices are 64-bit, so this is safe
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        
        // Required for react-native-config when using different package names
        resValue "string", "build_config_package", "com.payairo"

        manifestPlaceholders = [googleMapsApiKey: googleMapsApiKey]
    }
    
    /**
     * Product Flavors Configuration
     * Defines staging and production variants with different configurations
     */
    flavorDimensions "environment"
    productFlavors {
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "PayAiro Staging"
            resValue "string", "env_name", "staging"
            
            // Manifest placeholders can be used for environment-specific values
            manifestPlaceholders = [
                appName: "PayAiro Staging",
                googleMapsApiKey: googleMapsApiKey
            ]
        }
        
        production {
            dimension "environment"
            resValue "string", "app_name", "PayAiro"
            resValue "string", "env_name", "production"
            
            // Manifest placeholders
            manifestPlaceholders = [
                appName: "PayAiro",
                googleMapsApiKey: googleMapsApiKey
            ]
        }
    }

    // Enable 16 KB page size support
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            // okhttp-urlconnection, okhttp-java-net-cookiejar and jspecify each ship this OSGi
            // descriptor. It is build-time metadata with no runtime role, so keeping one copy
            // (rather than failing the merge) is safe.
            excludes += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
          release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            // signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

configurations.all {
    resolutionStrategy {
        // Keep every okhttp module on one version.
        //
        // com.coinme:risk-sdk-android requires okhttp 5.3.2, which wins conflict resolution for
        // the core `okhttp` artifact. `okhttp-urlconnection` is a SEPARATE module that React
        // Native pins at 4.9.2, so it does not get bumped along with it — and its
        // JavaNetCookieJar calls okhttp3.internal.Util, a class removed in okhttp 5. The result
        // is that any RN network request which consults the cookie jar dies with
        // "NoClassDefFoundError: Lokhttp3/internal/Util" on the OkHttp Dispatcher thread.
        // Aligning up to 5.3.2 (rather than down) keeps the Coinme SDK on the version it needs.
        force "com.squareup.okhttp3:okhttp:5.3.2"
        force "com.squareup.okhttp3:okhttp-urlconnection:5.3.2"

        // Force androidx.browser version to be compatible with compileSdk 36
        force "androidx.browser:browser:1.9.0"
        // Force CameraX 1.4.2+ for 16KB page size support (overrides react-native-camera-kit's 1.1.0)
        force "androidx.camera:camera-core:1.4.2"
        force "androidx.camera:camera-camera2:1.4.2"
        force "androidx.camera:camera-lifecycle:1.4.2"
        force "androidx.camera:camera-view:1.4.2"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    
    // Required for react-native-freshchat-sdk (LocalBroadcastManager)
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    
    // Force androidx.browser version compatible with compileSdk 36
    implementation "androidx.browser:browser:1.9.0"
    
    // Force newer CameraX version with 16KB support (overrides react-native-camera-kit's old version)
    // CameraX 1.4.2+ includes 16KB-aligned native libraries (used in react-native-camera-kit v15.1.0+)
    def camerax_version = "1.4.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    
    // ZXing for QR code scanning from gallery images (PayAiroQRScanner native module)
    // Offline, reliable, no external service dependencies
    implementation 'com.google.zxing:core:3.5.3'
    
    // EXIF support for image rotation handling
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    
    // Coroutines for background processing.
    // Kept in step with the Kotlin toolchain (2.3.x, see root build.gradle): the Coinme Risk SDK
    // ships Kotlin 2.3.0 metadata, and a stdlib/coroutines skew surfaces at runtime as
    // NoSuchMethodError/LinkageError the moment the engine is first called.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Coinme Risk SDK (fraud / behavioral risk engine).
    // Distributed privately via Cloudsmith; repo is declared in root build.gradle
    // using COINME_TOKEN from coinme.properties (shared with iOS Podfile).
    // 1.1.0 adds getPartnerSessionTag() which talks to Coinme's public partner
    // endpoint directly (no backend proxy required, mirrors iOS behavior).
    implementation 'com.coinme:risk-sdk-android:1.1.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
