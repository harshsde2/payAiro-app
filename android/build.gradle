buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "28.0.12433566"
        kotlinVersion = "1.9.24"
        // AndroidX Browser version for react-native-inappbrowser-reborn (compatible with compileSdk 35)
        // Using 1.8.0 which should work with compileSdk 35 (1.9.0+ requires compileSdk 36)
        androidXBrowser = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        maven { url "https://jitpack.io" }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.dependencies {
                // Required for react-native-freshchat-sdk (LocalBroadcastManager)
                implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
