buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // NDK r28+ is recommended for 16KB page-size compliance (ELF alignment defaults to 16KB).
        ndkVersion = "28.0.12433566"
        kotlinVersion = "2.1.20"
        // AndroidX Browser version for react-native-inappbrowser-reborn (compatible with compileSdk 36)
        androidXBrowser = "1.9.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.4'
    }
}

allprojects {
    repositories {
        maven { url "https://jitpack.io" }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.dependencies {
                // Required for react-native-freshchat-sdk (LocalBroadcastManager)
                implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
