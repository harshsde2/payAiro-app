# Nginx Configuration for Universal Links & App Links
# Add this to your Nginx server block configuration

# Serve apple-app-site-association with correct Content-Type
# This file MUST be served as application/json (NOT text/plain or application/octet-stream)
location /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Content-Type application/json;
    add_header Access-Control-Allow-Origin *;
    
    # Optional: Cache for 1 hour
    expires 1h;
    add_header Cache-Control "public, immutable";
}

# Serve assetlinks.json with correct Content-Type
location /.well-known/assetlinks.json {
    default_type application/json;
    add_header Content-Type application/json;
    add_header Access-Control-Allow-Origin *;
    
    # Optional: Cache for 1 hour
    expires 1h;
    add_header Cache-Control "public, immutable";
}

# Handle referral deep links - serve landing page
location ~ ^/ref/(.+)$ {
    try_files /ref/index.html =404;
}

